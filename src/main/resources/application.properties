# Cinesphere Backend
server.port=8080
server.servlet.context-path=/

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/tramell_cinesphere_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=dummy_db_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Run data.sql after Hibernate has created/updated the schema
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Public backend URL used in receipt links
application.base-url=http://localhost:8080

# JWT
application.security.jwt.secret-key=dummy_jwt_secret_key_that_is_at_least_256_bits_long_for_hs256_algorithm
application.security.jwt.expiration=86400000

# Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Local demo accounts. Disable app.seed-demo-users in production.
app.seed-demo-users=true
app.demo-admin-email=${CINESPHERE_DEMO_ADMIN_EMAIL:Admin@cinesphere.com}
app.demo-admin-password=dummy_admin_password
app.demo-customer-email=${CINESPHERE_DEMO_CUSTOMER_EMAIL:user@cinesphere.com}
app.demo-customer-password=dummy_user_password
